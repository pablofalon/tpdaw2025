<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscaminas</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="page-header">
        <h1>Buscaminas</h1>
    </header>
    <main class="page-main">
        <section class="game-container">
            <div class="game-panel">
                <div id="mine-counter" class="counter-display">000</div>
                <button id="reset-button" class="reset-button" type="button">🙂</button>
                <div id="timer-display" class="counter-display">000</div>
            </div>
            <div id="game-board" class="game-board"></div>
        </section>
    </main>
    <footer class="page-footer">
        <p>Trabajo final - Buscaminas</p>
    </footer>
    <div id="name-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2>Bienvenido a Buscaminas</h2>
            <label for="player-name-input">Ingresá tu nombre para jugar</label>
            <input id="player-name-input" class="modal-input" type="text" maxlength="20">
            <p id="name-error" class="modal-error hidden">El nombre debe tener al menos 3 letras.</p>
            <button id="name-submit-button" class="modal-button" type="button">Jugar</button>
        </div>
    </div>
    <div id="result-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 id="result-title"></h2>
            <p id="result-message"></p>
        </div>
    </div>
    <script src="js/core-game.js"></script>
    <script src="js/board-render.js"></script>
    <script src="js/panel-render.js"></script>
    <script src="js/dom-init.js"></script>
    <script src="js/event-handlers.js"></script>
</body>
</html>
