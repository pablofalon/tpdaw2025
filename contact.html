<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Buscaminas</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="page-header">
        <h1>Contacto</h1>
    </header>
    <main class="page-main">
        <form id="contact-form" class="contact-form">
            <div class="form-field">
                <label for="contact-name">Nombre</label>
                <input id="contact-name" name="name" class="form-input" type="text">
                <p id="contact-name-error" class="modal-error hidden">Ingresá un nombre alfanumérico válido.</p>
            </div>
            <div class="form-field">
                <label for="contact-email">Correo electrónico</label>
                <input id="contact-email" name="email" class="form-input" type="text">
                <p id="contact-email-error" class="modal-error hidden">Ingresá un correo electrónico válido.</p>
            </div>
            <div class="form-field">
                <label for="contact-message">Mensaje</label>
                <textarea id="contact-message" name="message" class="form-textarea"></textarea>
                <p id="contact-message-error" class="modal-error hidden">El mensaje debe tener más de 5 caracteres.</p>
            </div>
            <button id="contact-submit-button" class="modal-button" type="submit">Enviar</button>
        </form>
    </main>
    <footer class="page-footer">
        <a href="index.html" class="footer-link">Volver al juego</a>
    </footer>
</body>
</html>
